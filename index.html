<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Rokumon Pool</title>
<meta name="description" content="Rokumon Pool: 8-ball in the browser. Play the computer at three difficulty levels or a friend on the same device. Drag to pull back the cue, release to shoot." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f5132'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23111827'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23f8fafc'/%3E%3Ctext x='32' y='37' font-family='sans-serif' font-size='13' font-weight='700' text-anchor='middle' fill='%23111827'%3E8%3C/text%3E%3C/svg%3E" />
<style>
  html,body{height:100%;margin:0;background:#0b1020;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  #app{position:fixed;inset:0}
  canvas{touch-action:none}
  #loading{position:fixed;inset:0;display:grid;place-items:center;margin:0;color:#93c5fd;font:600 18px/1.4 sans-serif;letter-spacing:.08em}
  #rotate{display:none;position:fixed;inset:0;background:#0b1020;color:#e7efff;font:16px/1.5 sans-serif;place-items:center;text-align:center;padding:24px;z-index:10}
  #rotate .icon{font-size:48px;display:block;margin-bottom:12px;animation:tilt 1.6s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
  @media (orientation: portrait) and (pointer: coarse) and (max-width: 900px){#rotate{display:grid}}
</style>
</head>
<body>
<main id="app" aria-label="Rokumon Pool"></main>
<p id="loading" role="status" aria-live="polite">RACKING UP…</p>
<div id="rotate" role="status"><div><span class="icon" aria-hidden="true">📱</span>Rotate your phone to landscape to play.</div></div>
<script src="/hub-bridge.js"></script><script type="module" src="/src/main.ts"></script>
</body>
</html>
